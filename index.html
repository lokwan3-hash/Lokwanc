
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111713">
  <meta name="description" content="A space for ideas, reflection and experiences.">
  <title>Lokwan Chhantyal — Ideas · Reflection · Experiences</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --background: #111713;
      --paper: #f0eee5;
      --muted: #b9beb4;
      --sage: #aab6a5;
      --copper: #c49a72;
      --line: #777;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 20px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      text-align: center;
      color: var(--paper);
      background:
        radial-gradient(ellipse at 15% 15%, rgba(52,72,58,.68), transparent 42%),
        radial-gradient(ellipse at 85% 85%, rgba(38,57,74,.62), transparent 45%),
        var(--background);
      font-family: "DM Sans", sans-serif;
    }

    .container {
      width: min(100%, 850px);
      padding: 52px 20px;
      animation: appear 850ms ease both;
    }

    .eyebrow {
      margin: 0 0 27px;
      color: #a8ad9e;
      font-family: "DM Sans", sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    .name {
      margin: 0;
      color: var(--paper);
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(45px, 8.5vw, 82px);
      font-weight: 700;
      letter-spacing: -.045em;
      line-height: 1.08;
    }

    .name span { color: var(--copper); }

    .divider {
      width: 42px;
      height: 1px;
      margin: 35px auto;
      background: var(--copper);
    }

    .status {
      margin-bottom: 18px;
      color: #b89c78;
      font-family: "Space Grotesk", sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 3.5px;
      text-transform: uppercase;
    }

    .description {
      max-width: 460px;
      margin: 22px auto 34px;
      color: var(--muted);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 15px;
      font-style: italic;
      font-weight: 500;
      line-height: 1.55;
    }

    .contact a {
      display: inline-block;
      padding: 14px 29px;
      border: 1px solid var(--line);
      border-radius: 40px;
      color: #fff;
      font-family: "DM Sans", sans-serif;
      font-size: 12px;
      letter-spacing: .4px;
      text-decoration: none;
      transition: background .3s ease, color .3s ease, border-color .3s ease;
    }

    .contact a:hover,
    .contact a:focus-visible {
      border-color: var(--copper);
      outline: none;
      background: var(--copper);
      color: var(--background);
    }

    footer {
      margin-top: 70px;
      color: #818c80;
      font-size: 9px;
      letter-spacing: 3px;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }

    @media (max-width: 500px) {
      .container { padding: 42px 10px; }
      .eyebrow { font-size: 9px; letter-spacing: 3px; }
      .name { letter-spacing: -.035em; }
      .description { font-size: 14px; }
      .status { letter-spacing: 2.5px; }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="eyebrow">Ideas · Reflection · Experiences</div>

    <h1 class="name">Lokwan <span>Chhantyal</span></h1>

    <div class="divider" aria-hidden="true"></div>

    <div class="status">"Driven by vision,Built with purpose"</div>

    <p class="description">
      A space for ideas, reflection and experiences.
      Exploring creativity, discovering new perspectives,
      and appreciating the little things that make life meaningful.
    </p>

    <div class="contact">
      <a href="mailto:lokwan3@gmail.com">Get in touch →</a>
    </div>

    <footer>© 2026 LOKWAN CHHANTYAL</footer>
  </main>
</body>
</html>
